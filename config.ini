; BiliCacheMerge 配置文件
; 命令行通过 -config 指定本文件路径，默认为程序同目录下的 config.ini

; 缓存根目录：B 站客户端缓存的父目录，其下每个子目录为一个已缓存视频
[cache]
dir = D:\Binai\Videos\bilibili

; 合并后的 MP4 输出目录（必须已存在，否则程序提示并退出；其下按合集标题建子目录）
[output]
dir = D:\Binai\Downloads\BiliCacheMergeOutput

; ffmpeg 可执行文件路径
[ffmpeg]
path = C:\ProFiles\cmd\ffmpeg.bat
